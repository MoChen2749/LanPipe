name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 前端与 Rust 检查
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm ci

      - name: 检查 i18n 键
        run: node tools/check-i18n.mjs

      - name: 构建前端
        run: npm run build

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: 构建 release（Windows 桌面）
        run: cargo build --release --features custom-protocol -p lanpipe
