name: Release

# 推送 tag（例如 v0.1.2）触发：构建 Windows MSI + 独立 exe、Linux 桌面二进制 + 静态 CLI，
# 签名并生成 latest.json，创建 GitHub Release。所有最终产物统一放在仓库根目录 artifacts\ 下。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验版本与签名密钥
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $conf = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($conf.version -ne $version) {
            throw "tag 版本 $version 与 tauri.conf.json 版本 $($conf.version) 不一致"
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "缺少 Secret TAURI_SIGNING_PRIVATE_KEY" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw "缺少 Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          Write-Host "版本 $version 校验通过"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 打包 MSI
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          cd apps/desktop/src-tauri
          npx --no-install tauri build --bundles msi

      - name: 收集 Windows 产物
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          Copy-Item $msi.FullName "artifacts/LanPipe_${version}_x64_zh-CN.msi"
          Copy-Item "$($msi.FullName).sig" "artifacts/LanPipe_${version}_x64_zh-CN.msi.sig"
          Copy-Item target/release/lanpipe.exe "artifacts/LanPipe_${version}_x64-windows.exe"

      - name: 生成 latest.json
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $msi = Get-ChildItem artifacts/*.msi | Select-Object -First 1
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($msi.Name)"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/publish-release.ps1 `
            -Installer $msi.FullName -Version $version -Url $url -Notes "LanPipe $version" `
            -OutFile artifacts/latest.json

      - name: 校验产物齐全
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $expected = @(
            "artifacts/LanPipe_${version}_x64_zh-CN.msi",
            "artifacts/LanPipe_${version}_x64_zh-CN.msi.sig",
            "artifacts/LanPipe_${version}_x64-windows.exe",
            "artifacts/latest.json"
          )
          foreach ($path in $expected) {
            if (-not (Test-Path $path)) { throw "缺少产物 $path" }
          }
          $raw = Get-Content artifacts/latest.json -Raw
          if ($raw[0] -eq [char]0xFEFF) { throw "latest.json 带 BOM" }
          Get-ChildItem artifacts | Select-Object Name, Length | Format-Table

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LanPipe ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LanPipe-${{ github.ref_name }}
          path: artifacts/*

  linux:
    name: 构建 Linux 二进制
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          key: linux-release

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev file dpkg-dev

      - name: 检查依赖
        run: bash tools/build-linux.sh deps

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 构建桌面二进制
        run: SKIP_FRONTEND=1 bash tools/build-linux.sh desktop

      - name: 构建静态 CLI
        run: CLI_TARGET=x86_64-unknown-linux-musl SKIP_FRONTEND=1 bash tools/build-linux.sh cli

      - name: 收集 Linux 产物
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          mkdir -p artifacts
          cp dist-linux/lanpipe "artifacts/LanPipe_${version}_x86_64-linux"
          cp dist-linux/lanpipe-cli "artifacts/lanpipe-cli_${version}_x86_64-linux"
          chmod +x artifacts/*
          file artifacts/*

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: artifacts/*

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LanPipe-linux-${{ github.ref_name }}
          path: artifacts/*
