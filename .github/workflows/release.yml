name: Release

# 推送 tag（例如 v0.1.2）触发：构建 Windows MSI + 独立 exe、Linux 桌面二进制 + 静态 CLI，签名并生成 latest.json，创建 GitHub Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验版本与签名密钥
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $conf = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($conf.version -ne $version) {
            throw "tag 版本 $version 与 tauri.conf.json 版本 $($conf.version) 不一致"
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "缺少 Secret TAURI_SIGNING_PRIVATE_KEY" }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw "缺少 Secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD" }
          Write-Host "版本 $version 校验通过"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 打包 MSI
        shell: powershell
        run: |
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
          cd apps/desktop/src-tauri
          npx --no-install tauri build --bundles msi

      - name: 收集独立 exe
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path target/release/artifacts | Out-Null
          Copy-Item target/release/lanpipe.exe "target/release/artifacts/LanPipe_${{ github.ref_name }}_x64-windows.exe"

      - name: 生成 latest.json
        shell: powershell
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$($msi.Name)"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/publish-release.ps1 `
            -Installer $msi.FullName -Version $version -Url $url -Notes "LanPipe $version" `
            -OutFile target/release/artifacts/latest.json

      - name: 校验产物齐全
        shell: powershell
        run: |
          $msi = @(Get-ChildItem target/release/bundle/msi/*.msi)
          $sig = @(Get-ChildItem target/release/bundle/msi/*.msi.sig)
          $exe = @(Get-ChildItem target/release/artifacts/*.exe)
          $latest = "target/release/artifacts/latest.json"
          if ($msi.Count -lt 1) { throw "未找到 MSI 安装包" }
          if ($sig.Count -lt 1) { throw "未找到 MSI 签名" }
          if ($exe.Count -lt 1) { throw "未找到独立 exe" }
          if (-not (Test-Path $latest)) { throw "未找到 latest.json" }
          $raw = Get-Content $latest -Raw
          if ($raw[0] -eq [char]0xFEFF) { throw "latest.json 带 BOM" }
          Write-Host "产物校验通过：$($msi[0].Name) / $($exe[0].Name)"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LanPipe ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            target/release/artifacts/*.exe
            target/release/artifacts/latest.json

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LanPipe-${{ github.ref_name }}
          path: |
            target/release/bundle/msi/*
            target/release/artifacts/*

  linux:
    name: 构建 Linux 二进制
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          key: linux-release

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev file dpkg-dev

      - name: 检查依赖
        run: bash tools/build-linux.sh deps

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 构建桌面二进制
        run: SKIP_FRONTEND=1 bash tools/build-linux.sh desktop

      - name: 构建静态 CLI
        run: CLI_TARGET=x86_64-unknown-linux-musl SKIP_FRONTEND=1 bash tools/build-linux.sh cli

      - name: 收集二进制
        run: |
          set -e
          mkdir -p target/release/artifacts
          cp dist-linux/lanpipe "target/release/artifacts/LanPipe_${{ github.ref_name }}_x86_64-linux"
          cp dist-linux/lanpipe-cli "target/release/artifacts/lanpipe-cli_${{ github.ref_name }}_x86_64-linux"
          chmod +x target/release/artifacts/*
          file target/release/artifacts/*

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: target/release/artifacts/*

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: LanPipe-linux-${{ github.ref_name }}
          path: target/release/artifacts/*
