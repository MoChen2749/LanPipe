[package]
name = "lanpipe"
description = "LanPipe — 局域网零暂存文件传输"
version.workspace = true
edition.workspace = true
license.workspace = true

# 桌面（bin）与移动端（Android/iOS 的原生库）共用同一份核心实现：
# - rlib 给 bin / 测试用；
# - staticlib 给 iOS 静态链接；
# - cdylib 给 Android 打包成 liblanpipe_lib.so。
[lib]
name = "lanpipe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 生产构建必须启用：让 Tauri 使用内嵌前端资源（tauri://localhost），而不是 devUrl。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
lanpipe-proto = { path = "../../../crates/lanpipe-proto" }
lanpipe-net = { path = "../../../crates/lanpipe-net" }
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
if-addrs = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

# 仅桌面端：单实例与自更新依赖桌面窗口/安装器语义，移动端不引入（Play Store / App Store 负责更新）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
