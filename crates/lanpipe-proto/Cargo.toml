[package]
name = "lanpipe-proto"
version = "0.1.0"
edition = "2021"
description = "LanPipe LP/1 帧与消息定义"

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-util"] }
