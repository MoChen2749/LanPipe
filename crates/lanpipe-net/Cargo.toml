[package]
name = "lanpipe-net"
version = "0.1.0"
edition = "2021"
description = "LanPipe 发现与传输引擎"

[dependencies]
lanpipe-proto = { path = "../lanpipe-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "fs", "io-util", "macros"] }
socket2 = "0.5"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
if-addrs = "0.13"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
walkdir = "2"
